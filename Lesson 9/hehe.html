<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

        <h1>Weather App</h1>

    </div>
    <script src="app.js"></script>
</body>

</html>
